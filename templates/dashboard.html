<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Unilabs — Competitive Intelligence Platform</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-primary:#ffffff;--bg-secondary:#f8fafc;--bg-card:#ffffff;--bg-card-hover:#f1f5f9;
  --bg-surface:#f1f5f9;--border:#e2e8f0;--border-active:#cbd5e1;
  --text-primary:#0f172a;--text-secondary:#475569;--text-muted:#94a3b8;
  --navy:#003366;--navy-light:rgba(0,51,102,0.08);--navy-medium:rgba(0,51,102,0.12);
  --teal:#00a3e0;--teal-light:rgba(0,163,224,0.08);--teal-medium:rgba(0,163,224,0.15);
  --green:#059669;--green-light:rgba(5,150,105,0.08);
  --amber:#d97706;--amber-light:rgba(217,119,6,0.08);
  --purple:#7c3aed;--purple-light:rgba(124,58,237,0.08);
  --slate:#64748b;
  --gradient-brand:linear-gradient(135deg,#003366 0%,#00557a 100%);
  --shadow-sm:0 1px 3px rgba(0,0,0,.06);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
  --shadow-lg:0 10px 30px rgba(0,0,0,.1);
}
html{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg-secondary);color:var(--text-primary)}
body{min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.4}}
.animate-in{animation:fadeIn .4s ease-out both}
.slide-in{animation:slideIn .3s ease-out both}
select option{background:white;color:var(--text-primary)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ===================================================================
   ICONS
   =================================================================== */
const I = ({children, size=20, color="currentColor", vb="0 0 24 24"}) => (
  <svg width={size} height={size} viewBox={vb} fill="none" stroke={color}
       strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{children}</svg>
);
const Icons = {
  home: (p={}) => <I {...p}><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></I>,
  bot: (p={}) => <I {...p}><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><circle cx="8" cy="16" r="1"/><circle cx="16" cy="16" r="1"/></I>,
  settings: (p={}) => <I {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></I>,
  play: (p={}) => <I {...p}><polygon points="5 3 19 12 5 21 5 3"/></I>,
  clock: (p={}) => <I {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></I>,
  check: (p={}) => <I {...p}><polyline points="20 6 9 17 4 12"/></I>,
  alert: (p={}) => <I {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></I>,
  key: (p={}) => <I {...p}><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></I>,
  file: (p={}) => <I {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></I>,
  eye: (p={}) => <I {...p}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></I>,
  eyeOff: (p={}) => <I {...p}><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></I>,
  chevRight: (p={}) => <I {...p}><polyline points="9 18 15 12 9 6"/></I>,
  shield: (p={}) => <I {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></I>,
  zap: (p={}) => <I {...p}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></I>,
  activity: (p={}) => <I {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></I>,
  layers: (p={}) => <I {...p}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></I>,
  x: (p={}) => <I {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></I>,
  refresh: (p={}) => <I {...p}><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></I>,
  download: (p={}) => <I {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></I>,
  calendar: (p={}) => <I {...p}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></I>,
  power: (p={}) => <I {...p}><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></I>,
  target: (p={}) => <I {...p}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></I>,
  users: (p={}) => <I {...p}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></I>,
  send: (p={}) => <I {...p}><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></I>,
  msgCircle: (p={}) => <I {...p}><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></I>,
};

const Spinner = ({size=16, color="var(--navy)"}) => (
  <svg width={size} height={size} viewBox="0 0 24 24" style={{animation:'spin 1s linear infinite'}}>
    <circle cx="12" cy="12" r="10" stroke={color} strokeWidth="3" fill="none" strokeDasharray="31.4 31.4" strokeLinecap="round"/>
  </svg>
);

/* ===================================================================
   CATEGORY META
   =================================================================== */
const CATEGORY_META = {
  core: {label:"Core Competitive Modules", icon:Icons.target, gradient:"linear-gradient(135deg,#003366,#00557a)"},
  intelligence: {label:"Intelligence Modules", icon:Icons.zap, gradient:"linear-gradient(135deg,#00a3e0,#0077b6)"},
};

/* ===================================================================
   STATUS BADGE
   =================================================================== */
const StatusBadge = ({status}) => {
  const map = {
    pending:     {bg:"#f1f5f9", color:"#94a3b8", label:"Idle"},
    generating:  {bg:    "var(--teal-light)", color:"#0077b6", label:"Researching...", pulse:true},
    validating:  {bg:"var(--purple-light)",  color:"#7c3aed", label:"Validating...", pulse:true},
    done:        {bg:"var(--green-light)",  color:"#059669", label:"Complete"},
    error:       {bg:"#fef2f2",   color:"#dc2626", label:"Error"},
    running:     {bg:"var(--teal-light)",   color:"#0077b6", label:"Running...", pulse:true},
    completed:   {bg:"var(--green-light)",  color:"#059669", label:"Complete"},
  };
  const s = map[status] || map.pending;
  return (
    <span style={{display:'inline-flex',alignItems:'center',gap:6,padding:'4px 10px',borderRadius:20,
                  background:s.bg,color:s.color,fontSize:11,fontWeight:600,letterSpacing:'.3px',
                  textTransform:'uppercase',whiteSpace:'nowrap'}}>
      {s.pulse && <span style={{width:6,height:6,borderRadius:'50%',background:s.color,display:'inline-block',
                                animation:'pulse-dot 1.5s ease-in-out infinite'}}/>}
      {(status==='done'||status==='completed') && <Icons.check size={12}/>}
      {status==='error' && <Icons.alert size={12}/>}
      {s.label}
    </span>
  );
};

/* ===================================================================
   AGENT CARD
   =================================================================== */
const AgentCard = ({agent, status, enabled, onToggle, onExpand, expanded}) => {
  const isActive = status==='generating'||status==='validating'||status==='running';
  return (
    <div className="animate-in" style={{
      background:'var(--bg-card)',
      border:`1px solid ${isActive?'var(--teal)':enabled?'var(--border-active)':'var(--border)'}`,
      borderRadius:14,overflow:'hidden',transition:'all .3s ease',
      boxShadow:isActive?'0 0 20px rgba(0,163,224,.1)':'var(--shadow-sm)',opacity:enabled?1:0.55,
    }}>
      <div style={{height:3,background:agent.color,opacity:enabled?1:0.3,transition:'opacity .3s'}}/>
      <div style={{padding:'16px 20px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:12}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
              <div style={{width:32,height:32,borderRadius:10,background:`${agent.color}14`,
                           display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <Icons.target size={16} color={agent.color}/>
              </div>
              <h3 style={{fontSize:13,fontWeight:700,color:'var(--text-primary)',lineHeight:1.3}}>{agent.title}</h3>
            </div>
            <div style={{display:'flex',gap:5,flexWrap:'wrap',marginTop:8}}>
              {['Agent A','Agent B'].map(l=>(
                <span key={l} style={{fontSize:9,padding:'2px 8px',borderRadius:6,background:'var(--green-light)',
                  color:'var(--green)',fontWeight:700,letterSpacing:'.3px'}}>{l}</span>
              ))}
              <span style={{fontSize:9,padding:'2px 8px',borderRadius:6,background:'var(--amber-light)',
                color:'var(--amber)',fontWeight:700,letterSpacing:'.3px'}}>WEB SEARCH</span>
              <span style={{fontSize:9,padding:'2px 8px',borderRadius:6,background:'var(--navy-light)',
                color:'var(--navy)',fontWeight:700,letterSpacing:'.3px'}}>VS COMPETITORS</span>
            </div>
          </div>
          <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:8}}>
            <StatusBadge status={status}/>
            <label style={{position:'relative',width:36,height:20,cursor:'pointer',display:'block'}}>
              <input type="checkbox" checked={enabled} onChange={()=>onToggle(agent.id)}
                style={{opacity:0,position:'absolute',width:'100%',height:'100%',cursor:'pointer',zIndex:1,margin:0}}/>
              <div style={{width:36,height:20,borderRadius:10,transition:'.2s',
                background:enabled?'var(--navy)':'var(--border)'}}>
                <div style={{width:16,height:16,borderRadius:8,background:'white',position:'absolute',top:2,
                  left:enabled?18:2,transition:'.2s',boxShadow:'0 1px 3px rgba(0,0,0,.2)'}}/>
              </div>
            </label>
          </div>
        </div>
        <div style={{cursor:'pointer',display:'flex',alignItems:'center',gap:4,marginTop:10,
                     color:'var(--text-muted)',fontSize:11,fontWeight:500,userSelect:'none'}}
             onClick={()=>onExpand(agent.id)}>
          <span style={{transform:expanded?'rotate(90deg)':'none',transition:'.2s',display:'inline-flex'}}>
            <Icons.chevRight size={14}/>
          </span>
          Competitive Focus Details
        </div>
        {expanded && (
          <div className="slide-in" style={{marginTop:10,padding:12,borderRadius:10,background:'var(--bg-secondary)',
                                            border:'1px solid var(--border)',fontSize:12,lineHeight:1.6}}>
            <div style={{marginBottom:8}}>
              <span style={{color:'var(--navy)',fontWeight:600}}>Unilabs Research:</span>
              <span style={{color:'var(--text-secondary)',marginLeft:6}}>{agent.agentA}</span>
            </div>
            <div style={{marginBottom:8}}>
              <span style={{color:'var(--navy)',fontWeight:600}}>Competitor Intelligence:</span>
              <span style={{color:'var(--text-secondary)',marginLeft:6}}>{agent.agentB}</span>
            </div>
            <div style={{padding:'6px 10px',borderRadius:8,background:'var(--purple-light)',
                         border:'1px solid rgba(124,58,237,.12)',display:'flex',alignItems:'flex-start',gap:6}}>
              <Icons.shield size={13} color="var(--purple)"/>
              <div>
                <span style={{color:'var(--purple)',fontWeight:600,fontSize:11}}>CI Validator</span>
                <span style={{color:'var(--text-muted)',fontSize:11,display:'block'}}>
                  Merges competitive insights, ensures Unilabs vs competitor framing, flags unverified claims
                </span>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

/* ===================================================================
   ADMIN PANEL
   =================================================================== */
const AdminPanel = ({onClose, keysStatus, onSaveKeys}) => {
  const [openaiKey, setOpenaiKey] = useState("");
  const [anthropicKey, setAnthropicKey] = useState("");
  const [geminiKey, setGeminiKey] = useState("");
  const [provider, setProvider] = useState(keysStatus.provider || "auto");
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);
  const [validating, setValidating] = useState(false);
  const [valResults, setValResults] = useState(null);
  const [showOai, setShowOai] = useState(false);
  const [showAnthropic, setShowAnthropic] = useState(false);
  const [showGemini, setShowGemini] = useState(false);

  const handleSave = async () => {
    if(!openaiKey && !anthropicKey && !geminiKey && provider === (keysStatus.provider || "auto")) return;
    setSaving(true);
    await onSaveKeys({openaiKey, anthropicKey, geminiKey, provider});
    setSaving(false); setSaved(true);
    setOpenaiKey(""); setAnthropicKey(""); setGeminiKey(""); setValResults(null);
    setTimeout(()=>setSaved(false),2000);
  };

  const handleValidate = async () => {
    setValidating(true); setValResults(null);
    try {
      const body = {};
      if(openaiKey) body.openai_key = openaiKey;
      if(anthropicKey) body.anthropic_key = anthropicKey;
      if(geminiKey) body.gemini_key = geminiKey;
      const resp = await fetch('/api/keys/validate',{method:'POST',
        headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
      setValResults(await resp.json());
    } catch(e) { setValResults({error: e.message}); }
    setValidating(false);
  };

  return (
    <div style={{position:'fixed',inset:0,zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',
                 background:'rgba(0,0,0,.3)',backdropFilter:'blur(6px)'}} onClick={onClose}>
      <div className="animate-in" onClick={e=>e.stopPropagation()}
           style={{background:'white',borderRadius:20,border:'1px solid var(--border)',
                   width:'100%',maxWidth:520,maxHeight:'90vh',overflow:'auto',boxShadow:'var(--shadow-lg)'}}>
        <div style={{padding:'24px 28px 0',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div style={{width:40,height:40,borderRadius:12,background:'var(--gradient-brand)',
                         display:'flex',alignItems:'center',justifyContent:'center'}}>
              <Icons.settings size={20} color="white"/>
            </div>
            <div>
              <h2 style={{fontSize:18,fontWeight:800,color:'var(--navy)'}}>Admin Settings</h2>
              <p style={{fontSize:12,color:'var(--text-muted)'}}>Configure API keys for competitive intelligence</p>
            </div>
          </div>
          <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',
            color:'var(--text-muted)',padding:8,borderRadius:8,display:'flex'}}><Icons.x size={20}/></button>
        </div>
        <div style={{padding:'20px 28px 28px'}}>
          <div style={{marginBottom:20}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
              <label style={{fontSize:13,fontWeight:700,color:'var(--text-primary)',display:'flex',alignItems:'center',gap:8}}>
                <div style={{width:24,height:24,borderRadius:6,background:'var(--purple-light)',
                             display:'flex',alignItems:'center',justifyContent:'center'}}>
                  <Icons.zap size={13} color="var(--purple)"/>
                </div>
                AI Provider
              </label>
              {keysStatus.active_provider && <span style={{fontSize:10,padding:'3px 8px',borderRadius:6,
                background:'var(--navy-light)',color:'var(--navy)',fontWeight:600}}>
                ACTIVE: {keysStatus.active_provider.toUpperCase()}
              </span>}
            </div>
            <select value={provider} onChange={e=>setProvider(e.target.value)}
              style={{width:'100%',padding:'10px 12px',borderRadius:10,border:'1px solid var(--border)',
                background:'var(--bg-secondary)',color:'var(--text-primary)',fontSize:13,outline:'none',marginBottom:12}}>
              <option value="auto">Auto - use any configured key</option>
              <option value="openai">OpenAI only</option>
              <option value="anthropic">Anthropic only</option>
              <option value="gemini">Gemini only</option>
            </select>

            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
              <label style={{fontSize:13,fontWeight:700,color:'var(--text-primary)',display:'flex',alignItems:'center',gap:8}}>
                <div style={{width:24,height:24,borderRadius:6,background:'var(--green-light)',
                             display:'flex',alignItems:'center',justifyContent:'center'}}>
                  <Icons.key size={13} color="var(--green)"/>
                </div>
                OpenAI API Key
              </label>
              {keysStatus.openai && <span style={{fontSize:10,padding:'3px 8px',borderRadius:6,
                background:'var(--green-light)',color:'var(--green)',fontWeight:600}}>CONFIGURED</span>}
            </div>
            <p style={{fontSize:11,color:'var(--text-muted)',marginBottom:8,lineHeight:1.5}}>
              Powers CI agents with OpenAI web search for research, validation, and chat agent.
            </p>
            <div style={{position:'relative'}}>
              <input type={showOai?"text":"password"} value={openaiKey}
                onChange={e=>setOpenaiKey(e.target.value)}
                placeholder={keysStatus.openai?"key saved -- enter new to update":"sk-proj-..."}
                style={{width:'100%',padding:'12px 44px 12px 14px',borderRadius:10,
                  border:`1px solid ${keysStatus.openai?'rgba(5,150,105,.3)':'var(--border)'}`,
                  background:'var(--bg-secondary)',color:'var(--text-primary)',fontSize:13,fontFamily:'monospace',outline:'none'}}/>
              <button onClick={()=>setShowOai(!showOai)} style={{position:'absolute',right:12,top:'50%',
                transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',
                color:'var(--text-muted)',display:'flex'}}>
                {showOai ? <Icons.eyeOff size={16}/> : <Icons.eye size={16}/>}
              </button>
            </div>
          </div>

          <div style={{marginBottom:20}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
              <label style={{fontSize:13,fontWeight:700,color:'var(--text-primary)',display:'flex',alignItems:'center',gap:8}}>
                <div style={{width:24,height:24,borderRadius:6,background:'var(--purple-light)',
                             display:'flex',alignItems:'center',justifyContent:'center'}}>
                  <Icons.key size={13} color="var(--purple)"/>
                </div>
                Anthropic API Key
              </label>
              {keysStatus.anthropic && <span style={{fontSize:10,padding:'3px 8px',borderRadius:6,
                background:'var(--purple-light)',color:'var(--purple)',fontWeight:600}}>CONFIGURED</span>}
            </div>
            <p style={{fontSize:11,color:'var(--text-muted)',marginBottom:8,lineHeight:1.5}}>
              Optional alternative provider for CI agents and chat. You can configure OpenAI, Anthropic, Gemini, or any combination.
            </p>
            <div style={{position:'relative'}}>
              <input type={showAnthropic?"text":"password"} value={anthropicKey}
                onChange={e=>setAnthropicKey(e.target.value)}
                placeholder={keysStatus.anthropic?"key saved -- enter new to update":"sk-ant-..."}
                style={{width:'100%',padding:'12px 44px 12px 14px',borderRadius:10,

};

/* ===================================================================
   RUN CONFIG PANEL
   =================================================================== */
const RunConfigPanel = ({agents, countries, languages, competitors, enabledAgents, setEnabledAgents,
                         config, setConfig, onRun, running, keysOk}) => {
  const [customComp, setCustomComp] = useState("");
  const [periodType, setPeriodType] = useState("quarterly");
  const [selectedMonth, setSelectedMonth] = useState("04");

  const MONTHS = [
    {code:"01",name:"January"},{code:"02",name:"February"},{code:"03",name:"March"},
    {code:"04",name:"April"},{code:"05",name:"May"},{code:"06",name:"June"},
    {code:"07",name:"July"},{code:"08",name:"August"},{code:"09",name:"September"},
    {code:"10",name:"October"},{code:"11",name:"November"},{code:"12",name:"December"},
  ];

  const toggleCountry = (code) => setConfig(c=>({...c,countries:c.countries.includes(code)?c.countries.filter(x=>x!==code):[...c.countries,code]}));
  const toggleCompetitor = (name) => setConfig(c=>({...c,competitors:c.competitors.includes(name)?c.competitors.filter(x=>x!==name):[...c.competitors,name]}));
  const addCustom = () => { const n=customComp.trim(); if(n&&!config.custom_competitors.includes(n)){setConfig(c=>({...c,custom_competitors:[...c.custom_competitors,n]}));setCustomComp("");} };
  const removeCustom = (name) => setConfig(c=>({...c,custom_competitors:c.custom_competitors.filter(x=>x!==name)}));

  return (
    <div style={{background:'white',borderRadius:16,border:'1px solid var(--border)',overflow:'hidden',boxShadow:'var(--shadow-sm)'}}>
      <div style={{padding:'18px 22px',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <h3 style={{fontSize:14,fontWeight:800,color:'var(--navy)',display:'flex',alignItems:'center',gap:8}}>
          <Icons.target size={15} color="var(--navy)"/> Run Configuration
        </h3>
        <div style={{display:'flex',gap:5}}>
          <button onClick={()=>setEnabledAgents(agents.map(a=>a.id))}
            style={{fontSize:10,padding:'3px 9px',borderRadius:6,border:'1px solid var(--border)',background:'white',color:'var(--text-muted)',cursor:'pointer',fontWeight:600}}>All</button>
          <button onClick={()=>setEnabledAgents([])}
            style={{fontSize:10,padding:'3px 9px',borderRadius:6,border:'1px solid var(--border)',background:'white',color:'var(--text-muted)',cursor:'pointer',fontWeight:600}}>None</button>
        </div>
      </div>
      <div style={{padding:'14px 22px'}}>
        {/* Year + Language */}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}}>
          <div>
            <label style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',marginBottom:5,display:'block'}}>Year</label>
            <select value={config.years[0]} onChange={e=>setConfig(c=>({...c,years:[+e.target.value]}))}
              style={{width:'100%',padding:'9px 10px',borderRadius:8,border:'1px solid var(--border)',background:'white',color:'var(--text-primary)',fontSize:12,outline:'none'}}>
              {[2024,2025,2026].map(y=><option key={y} value={y}>{y}</option>)}
            </select>
          </div>
          <div>
            <label style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',marginBottom:5,display:'block'}}>Language</label>
            <select value={config.language} onChange={e=>setConfig(c=>({...c,language:e.target.value}))}
              style={{width:'100%',padding:'9px 10px',borderRadius:8,border:'1px solid var(--border)',background:'white',color:'var(--text-primary)',fontSize:12,outline:'none'}}>
              {languages.map(l=><option key={l.code} value={l.code}>{l.name}</option>)}
            </select>
          </div>
        </div>

        {/* Period toggle */}
        <div style={{marginBottom:10}}>
          <label style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',marginBottom:6,display:'block'}}>Time Period</label>
          <div style={{display:'flex',gap:6}}>
            <button onClick={()=>setPeriodType('quarterly')}
              style={{flex:1,padding:'8px',borderRadius:8,border:'1px solid',fontSize:11,fontWeight:600,cursor:'pointer',transition:'.2s',
                background:periodType==='quarterly'?'var(--navy)':'white',color:periodType==='quarterly'?'white':'var(--text-muted)'}}>
              Quarterly
            </button>
            <button onClick={()=>setPeriodType('monthly')}
              style={{flex:1,padding:'8px',borderRadius:8,border:'1px solid',fontSize:11,fontWeight:600,cursor:'pointer',transition:'.2s',
                background:periodType==='monthly'?'var(--navy)':'white',color:periodType==='monthly'?'white':'var(--text-muted)'}}>
              Monthly
            </button>
          </div>
        </div>
        {periodType==='quarterly' ? (
          <div style={{marginBottom:14}}>
            <select value={config.periods[0]} onChange={e=>setConfig(c=>({...c,periods:[e.target.value]}))}
              style={{width:'100%',padding:'9px 10px',borderRadius:8,border:'1px solid var(--border)',background:'white',color:'var(--text-primary)',fontSize:12,outline:'none'}}>
              {['Q1','Q2','Q3','Q4','H1','H2','FY'].map(q=><option key={q} value={q}>{q}</option>)}
            </select>
          </div>
        ) : (
          <div style={{marginBottom:14}}>
            <select value={selectedMonth} onChange={e=>{setSelectedMonth(e.target.value);setConfig(c=>({...c,periods:[`M${e.target.value}`]}));}}
              style={{width:'100%',padding:'9px 10px',borderRadius:8,border:'1px solid var(--border)',background:'white',color:'var(--text-primary)',fontSize:12,outline:'none'}}>
              {MONTHS.map(m=><option key={m.code} value={m.code}>{m.name}</option>)}
            </select>
          </div>
        )}

        {/* Markets */}
        <div style={{marginBottom:14}}>
          <label style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',marginBottom:6,display:'block'}}>Markets</label>
          <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
            {countries.map(c=>{
              const sel=config.countries.includes(c.code);
              return (<button key={c.code} onClick={()=>toggleCountry(c.code)} title={c.name}
                style={{padding:'4px 10px',borderRadius:7,fontSize:10,fontWeight:600,cursor:'pointer',transition:'.2s',border:'1px solid',
                  background:sel?'var(--teal-light)':'white',borderColor:sel?'var(--teal)':'var(--border)',color:sel?'#0077b6':'var(--text-muted)'}}>{c.code}</button>);
            })}
          </div>
        </div>

        {/* Competitors */}
        <div style={{marginBottom:14}}>
          <label style={{fontSize:10,fontWeight:600,color:'var(--navy)',marginBottom:6,display:'block',textTransform:'uppercase',letterSpacing:'.4px'}}>Benchmark Competitors</label>
          <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
            {competitors.map(name=>{
              const sel=config.competitors.includes(name);
              return (<button key={name} onClick={()=>toggleCompetitor(name)}
                style={{padding:'4px 10px',borderRadius:7,fontSize:10,fontWeight:600,cursor:'pointer',transition:'.2s',border:'1px solid',
                  background:sel?'var(--navy-light)':'white',borderColor:sel?'var(--navy)':'var(--border)',color:sel?'var(--navy)':'var(--text-muted)'}}>{name}</button>);
            })}
          </div>
          <div style={{display:'flex',gap:5,marginTop:6}}>
            <input value={customComp} onChange={e=>setCustomComp(e.target.value)} placeholder="Add custom competitor..."
              onKeyDown={e=>e.key==='Enter'&&addCustom()}
              style={{flex:1,padding:'6px 10px',borderRadius:7,border:'1px solid var(--border)',background:'white',color:'var(--text-primary)',fontSize:10,outline:'none'}}/>
            <button onClick={addCustom}
              style={{padding:'6px 10px',borderRadius:7,border:'1px solid var(--navy)',background:'var(--navy-light)',color:'var(--navy)',fontSize:10,fontWeight:700,cursor:'pointer'}}>+ Add</button>
          </div>
          {config.custom_competitors.length>0 && (
            <div style={{display:'flex',flexWrap:'wrap',gap:5,marginTop:5}}>
              {config.custom_competitors.map(name=>(
                <span key={name} style={{padding:'3px 8px',borderRadius:7,fontSize:10,fontWeight:600,
                  background:'var(--amber-light)',border:'1px solid rgba(217,119,6,.2)',color:'var(--amber)',display:'flex',alignItems:'center',gap:3}}>
                  {name}<span onClick={()=>removeCustom(name)} style={{cursor:'pointer',fontSize:13,lineHeight:1}}>&times;</span>
                </span>
              ))}
            </div>
          )}
        </div>

        <button onClick={onRun} disabled={running||!keysOk||enabledAgents.length===0}
          style={{width:'100%',padding:'12px',borderRadius:12,border:'none',cursor:'pointer',fontWeight:800,fontSize:13,color:'white',letterSpacing:'.3px',
            background:running?'var(--slate)':'var(--gradient-brand)',opacity:(running||!keysOk||enabledAgents.length===0)?0.5:1,
            display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
          {running?<><Spinner size={16} color="white"/> Running {enabledAgents.length} Agents...</>
                  :<><Icons.target size={16} color="white"/> Launch {enabledAgents.length} CI Agents</>}
        </button>
        {!keysOk && <p style={{textAlign:'center',fontSize:10,color:'#dc2626',marginTop:6}}>Configure an OpenAI, Anthropic, or Gemini API key in Admin Settings first</p>}
      </div>
    </div>
  );
};

/* ===================================================================
   LIVE MONITOR
   =================================================================== */
const LiveMonitor = ({agentStatuses, agents}) => {
  const active = Object.entries(agentStatuses).filter(([_,s])=>s==='generating'||s==='validating');
  if(active.length===0) return null;
  const agentMap = Object.fromEntries(agents.map(a=>[a.id,a]));
  return (
    <div style={{position:'fixed',bottom:24,right:24,zIndex:900,background:'white',
                 borderRadius:14,border:'1px solid var(--teal)',padding:'14px 18px',
                 boxShadow:'0 8px 30px rgba(0,163,224,.15)',minWidth:260}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
        <Icons.activity size={14} color="var(--teal)"/>
        <span style={{fontSize:12,fontWeight:700,color:'#0077b6'}}>LIVE -- {active.length} agent{active.length>1?'s':''} active</span>
      </div>
      {active.map(([aid, status]) => (
        <div key={aid} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'5px 0',borderTop:'1px solid var(--border)'}}>
          <span style={{fontSize:11,fontWeight:600,color:'var(--text-secondary)',maxWidth:150,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
            {agentMap[aid]?.title||aid}
          </span>
          <StatusBadge status={status}/>
        </div>
      ))}
    </div>
  );
};

/* ===================================================================
   AGENTS PAGE
   =================================================================== */
const AgentsPage = ({agents, agentStatuses, onAgentsChanged}) => {
  const [showCreate, setShowCreate] = useState(false);
  const [saving, setSaving] = useState(false);
  const [form, setForm] = useState({title:'', agentA:'', agentB:'', description:'', color:'#7c3aed'});
  const [deleteId, setDeleteId] = useState(null);

  const handleCreate = async () => {
    if(!form.title.trim() || !form.agentA.trim() || !form.agentB.trim()) return;
    setSaving(true);
    try {
      const res = await fetch('/api/custom-agents', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({title:form.title, agent_a_prompt:form.agentA, agent_b_prompt:form.agentB, description:form.description, color:form.color})
      });
      if(res.ok) {
        setShowCreate(false);
        setForm({title:'', agentA:'', agentB:'', description:'', color:'#7c3aed'});
        if(onAgentsChanged) onAgentsChanged();
      }
    } catch(e) { console.error(e); }
    setSaving(false);
  };

  const handleDelete = async (dbId) => {
    try {
      await fetch(`/api/custom-agents/${dbId}`, {method:'DELETE'});
      if(onAgentsChanged) onAgentsChanged();
    } catch(e) { console.error(e); }
    setDeleteId(null);
  };

  return (
    <div>
      <div style={{marginBottom:24,display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
        <div>
          <h1 style={{fontSize:22,fontWeight:900,color:'var(--navy)',marginBottom:4}}>CI Agent Registry</h1>
          <p style={{fontSize:13,color:'var(--text-muted)'}}>
            Each module runs two AI agents with web search focused on Unilabs vs competitors, then a validator merges and verifies the competitive insights.
          </p>
        </div>
        <button onClick={()=>setShowCreate(!showCreate)}
          style={{padding:'10px 18px',borderRadius:10,border:'none',background:'var(--gradient-brand)',color:'white',
            fontSize:12,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',gap:6,whiteSpace:'nowrap',flexShrink:0}}>
          <Icons.zap size={14} color="white"/> + Create Custom Agent
        </button>
      </div>

      {/* Create Custom Agent Form */}
      {showCreate && (
        <div className="animate-in" style={{background:'white',borderRadius:16,border:'2px solid var(--purple)',
          boxShadow:'0 8px 30px rgba(124,58,237,.12)',marginBottom:24,overflow:'hidden'}}>
          <div style={{padding:'16px 22px',background:'var(--purple-light)',borderBottom:'1px solid rgba(124,58,237,.2)',
            display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <div style={{width:32,height:32,borderRadius:8,background:'var(--purple)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                <Icons.zap size={16} color="white"/>
              </div>
              <div>
                <div style={{fontSize:14,fontWeight:800,color:'var(--purple)'}}>Create Custom Agent</div>
                <div style={{fontSize:10,color:'var(--text-muted)'}}>Defines a new CI module that runs alongside all built-in agents</div>
              </div>

/* ===================================================================
   SCHEDULER PANEL
   =================================================================== */
const DAYS = [{v:'mon',l:'Monday'},{v:'tue',l:'Tuesday'},{v:'wed',l:'Wednesday'},
              {v:'thu',l:'Thursday'},{v:'fri',l:'Friday'},{v:'sat',l:'Saturday'},{v:'sun',l:'Sunday'}];

const SchedulerPanel = () => {
  const [sched, setSched] = useState(null);
  const [saving, setSaving] = useState(false);
  const [triggering, setTriggering] = useState(false);
  const [day, setDay] = useState('mon');
  const [hour, setHour] = useState(10);
  const [minute, setMinute] = useState(0);
  const [enabled, setEnabled] = useState(true);

  const load = useCallback(()=>{fetch('/api/scheduler').then(r=>r.json()).then(data=>{
    setSched(data);setEnabled(!!data.enabled);
    if(data.cron){setDay(data.cron.day_of_week||'mon');setHour(data.cron.hour!=null?data.cron.hour:10);setMinute(data.cron.minute!=null?data.cron.minute:0);}
  });},[]);
  useEffect(()=>{load();},[load]);

  const saveConfig = async()=>{setSaving(true);await fetch('/api/scheduler/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled,day_of_week:day,hour:+hour,minute:+minute})});await load();setSaving(false);};
  const toggleEnabled = async()=>{const next=!enabled;setEnabled(next);await fetch('/api/scheduler/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:next})});await load();};
  const triggerNow = async()=>{setTriggering(true);await fetch('/api/scheduler/trigger',{method:'POST'});setTimeout(()=>setTriggering(false),2000);};
  const nextRun = sched?.jobs?.[0]?.next_run;

  return (
    <div style={{background:'white',borderRadius:16,border:'1px solid var(--border)',overflow:'hidden',boxShadow:'var(--shadow-sm)'}}>
      <div style={{padding:'18px 22px',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <h3 style={{fontSize:14,fontWeight:800,color:'var(--navy)',display:'flex',alignItems:'center',gap:8}}><Icons.calendar size={15}/> Auto Scheduler</h3>
        <button onClick={toggleEnabled}
          style={{display:'flex',alignItems:'center',gap:5,padding:'4px 10px',borderRadius:7,border:'1px solid',cursor:'pointer',fontSize:10,fontWeight:700,
            background:enabled?'var(--green-light)':'#fef2f2',borderColor:enabled?'rgba(5,150,105,.2)':'rgba(220,38,38,.15)',color:enabled?'var(--green)':'#dc2626'}}>
          <Icons.power size={11}/> {enabled?'Enabled':'Disabled'}
        </button>
      </div>
      <div style={{padding:'14px 22px'}}>
        {nextRun && enabled && (
          <div style={{padding:'8px 12px',borderRadius:8,background:'var(--teal-light)',border:'1px solid var(--teal-medium)',marginBottom:12,display:'flex',alignItems:'center',gap:6}}>
            <Icons.clock size={13} color="#0077b6"/>
            <div><div style={{fontSize:10,fontWeight:700,color:'#0077b6'}}>Next CI Scan</div>
              <div style={{fontSize:11,color:'var(--text-secondary)'}}>{new Date(nextRun).toLocaleString()}</div></div>
          </div>
        )}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:12}}>
          <div>
            <label style={{fontSize:9,fontWeight:600,color:'var(--text-muted)',marginBottom:3,display:'block'}}>Day</label>
            <select value={day} onChange={e=>setDay(e.target.value)}
              style={{width:'100%',padding:'7px 8px',borderRadius:7,border:'1px solid var(--border)',background:'white',color:'var(--text-primary)',fontSize:11,outline:'none'}}>
              {DAYS.map(d=><option key={d.v} value={d.v}>{d.l}</option>)}
            </select>
          </div>
          <div>
            <label style={{fontSize:9,fontWeight:600,color:'var(--text-muted)',marginBottom:3,display:'block'}}>Hour (CET)</label>
            <select value={hour} onChange={e=>setHour(+e.target.value)}
              style={{width:'100%',padding:'7px 8px',borderRadius:7,border:'1px solid var(--border)',background:'white',color:'var(--text-primary)',fontSize:11,outline:'none'}}>
              {Array.from({length:24},(_,i)=>i).map(h=><option key={h} value={h}>{String(h).padStart(2,'0')}:00</option>)}
            </select>
          </div>
          <div>
            <label style={{fontSize:9,fontWeight:600,color:'var(--text-muted)',marginBottom:3,display:'block'}}>Minute</label>
            <select value={minute} onChange={e=>setMinute(+e.target.value)}
              style={{width:'100%',padding:'7px 8px',borderRadius:7,border:'1px solid var(--border)',background:'white',color:'var(--text-primary)',fontSize:11,outline:'none'}}>
              {[0,15,30,45].map(m=><option key={m} value={m}>:{String(m).padStart(2,'0')}</option>)}
            </select>
          </div>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button onClick={saveConfig} disabled={saving}
            style={{flex:1,padding:'9px',borderRadius:9,border:'1px solid var(--border)',background:'white',color:'var(--text-primary)',cursor:'pointer',
              fontSize:11,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',gap:5,opacity:saving?0.5:1}}>
            {saving ? <><Spinner size={12}/> Saving...</> : <><Icons.calendar size={12}/> Save</>}
          </button>
          <button onClick={triggerNow} disabled={triggering}
            style={{flex:1,padding:'9px',borderRadius:9,border:'none',cursor:'pointer',background:'var(--gradient-brand)',color:'white',
              fontSize:11,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',gap:5,opacity:triggering?0.5:1}}>
            {triggering ? <><Spinner size={12} color="white"/> Triggered!</> : <><Icons.zap size={12}/> Run Now</>}
          </button>
        </div>
      </div>
    </div>
  );
};

/* ===================================================================
   CHAT PANEL — GPT-powered CI assistant
   =================================================================== */
const ChatPanel = ({onRunStarted, agents}) => {
  const [open, setOpen] = useState(false);
  const [messages, setMessages] = useState([
    {role:'assistant',content:'Hi! I\'m your CI assistant. Tell me what competitive analysis you need.\n\nExamples:\n- "Run M&A and pricing analysis for Q2 in NL and CH"\n- "Analyze Synlab and Eurofins talent moves across all markets"\n- "Run all agents for FY 2026"'}
  ]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const scrollRef = useRef(null);
  const inputRef = useRef(null);

  useEffect(()=>{
    if(scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  },[messages]);

  useEffect(()=>{
    if(open && inputRef.current) inputRef.current.focus();
  },[open]);

  const sendMessage = async() => {
    const text = input.trim();
    if(!text || loading) return;
    setInput("");
    const userMsg = {role:'user', content:text};
    setMessages(prev=>[...prev, userMsg]);
    setLoading(true);

    try {
      const history = messages.filter(m=>m.role!=='system').map(m=>({role:m.role,content:m.content}));
      const resp = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({message:text, history})});
      const data = await resp.json();

      if(data.action === 'run'){
        setMessages(prev=>[...prev,
          {role:'assistant', content:data.message},
          {role:'system', content:`Launched run #${data.run_id} with ${data.agent_names?.length||0} agents: ${(data.agent_names||[]).join(', ')}`}
        ]);
        if(onRunStarted) onRunStarted(data.run_id, data.config);
      } else {
        setMessages(prev=>[...prev, {role:'assistant', content:data.message}]);
      }
    } catch(e) {
      setMessages(prev=>[...prev, {role:'assistant', content:'Sorry, there was a connection error. Please try again.'}]);
    }
    setLoading(false);
  };

  if(!open){
    return (
      <button onClick={()=>setOpen(true)}
        style={{position:'fixed',bottom:24,left:24,zIndex:950,width:56,height:56,borderRadius:16,
          background:'var(--gradient-brand)',border:'none',cursor:'pointer',
          display:'flex',alignItems:'center',justifyContent:'center',
          boxShadow:'0 4px 20px rgba(0,51,102,.25)',transition:'transform .2s'}}>
        <Icons.msgCircle size={24} color="white"/>
      </button>
    );
  }

  return (
    <div style={{position:'fixed',bottom:24,left:24,zIndex:950,width:420,height:520,
                 background:'white',borderRadius:18,border:'1px solid var(--border)',
                 boxShadow:'var(--shadow-lg)',display:'flex',flexDirection:'column',overflow:'hidden'}}>
      {/* Header */}
      <div style={{padding:'14px 18px',background:'var(--gradient-brand)',color:'white',
                   display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <Icons.msgCircle size={18} color="white"/>
          <div>
            <div style={{fontSize:14,fontWeight:800}}>CI Assistant</div>
            <div style={{fontSize:10,opacity:.8}}>Powered by configured AI provider</div>
          </div>
        </div>
        <button onClick={()=>setOpen(false)} style={{background:'rgba(255,255,255,.15)',border:'none',
          borderRadius:8,padding:6,cursor:'pointer',display:'flex'}}><Icons.x size={16} color="white"/></button>
      </div>

      {/* Messages */}
      <div ref={scrollRef} style={{flex:1,overflowY:'auto',padding:'14px 16px',display:'flex',flexDirection:'column',gap:10}}>
        {messages.map((m,i)=>(
          <div key={i} style={{
            alignSelf:m.role==='user'?'flex-end':m.role==='system'?'center':'flex-start',
            maxWidth:m.role==='system'?'90%':'80%',
            animation:'slideUp .3s ease-out',
          }}>
            {m.role==='system' ? (
              <div style={{padding:'8px 14px',borderRadius:10,background:'var(--teal-light)',border:'1px solid var(--teal-medium)',
                fontSize:11,color:'#0077b6',fontWeight:600,textAlign:'center'}}>
                {m.content}
              </div>
            ) : (
              <div style={{padding:'10px 14px',borderRadius:m.role==='user'?'14px 14px 4px 14px':'14px 14px 14px 4px',
                background:m.role==='user'?'var(--navy)':'var(--bg-secondary)',
                color:m.role==='user'?'white':'var(--text-primary)',
                fontSize:13,lineHeight:1.5,whiteSpace:'pre-wrap',
                boxShadow:'var(--shadow-sm)'}}>
                {m.content}
              </div>
            )}
          </div>
        ))}
        {loading && (
          <div style={{alignSelf:'flex-start',padding:'10px 14px',borderRadius:'14px 14px 14px 4px',
            background:'var(--bg-secondary)',display:'flex',gap:4,alignItems:'center'}}>
            <span style={{width:6,height:6,borderRadius:'50%',background:'var(--navy)',animation:'pulse-dot 1.2s ease-in-out infinite'}}/>
            <span style={{width:6,height:6,borderRadius:'50%',background:'var(--navy)',animation:'pulse-dot 1.2s ease-in-out .2s infinite'}}/>
            <span style={{width:6,height:6,borderRadius:'50%',background:'var(--navy)',animation:'pulse-dot 1.2s ease-in-out .4s infinite'}}/>
          </div>
        )}
      </div>

      {/* Input */}
      <div style={{padding:'12px 14px',borderTop:'1px solid var(--border)',display:'flex',gap:8,flexShrink:0}}>
        <input ref={inputRef} value={input} onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&sendMessage()}
          placeholder="e.g. Run M&A analysis for Synlab in NL..."
          style={{flex:1,padding:'10px 14px',borderRadius:10,border:'1px solid var(--border)',
            background:'var(--bg-secondary)',color:'var(--text-primary)',fontSize:13,outline:'none'}}/>
        <button onClick={sendMessage} disabled={loading||!input.trim()}
          style={{width:42,height:42,borderRadius:10,border:'none',cursor:'pointer',
            background:input.trim()?'var(--gradient-brand)':'var(--bg-surface)',
            display:'flex',alignItems:'center',justifyContent:'center',transition:'.2s',
            opacity:loading||!input.trim()?0.5:1}}>
          <Icons.send size={18} color={input.trim()?'white':'var(--text-muted)'}/>
        </button>
      </div>
    </div>
  );
};

const App = () => {
  const [agents, setAgents] = useState([]);
  const [countries, setCountries] = useState([]);
  const [languages, setLanguages] = useState([]);
  const [competitors, setCompetitors] = useState([]);
  const [enabledAgents, setEnabledAgents] = useState([]);
  const [expandedAgent, setExpandedAgent] = useState(null);
  const [agentStatuses, setAgentStatuses] = useState({});
  const [runs, setRuns] = useState([]);
  const [keysStatus, setKeysStatus] = useState({openai:false, anthropic:false, gemini:false, provider:"auto", active_provider:null});
  const [showAdmin, setShowAdmin] = useState(false);
  const [running, setRunning] = useState(false);
  const [page, setPage] = useState('dashboard');
  const [config, setConfig] = useState({
    years:[2026], periods:['Q2'], countries:[], competitors:[], custom_competitors:[], language:'en'
  });
  const pollRef = useRef(null);

  useEffect(()=>{
    Promise.all([
      fetch('/api/agents').then(r=>r.json()),
      fetch('/api/countries').then(r=>r.json()),
      fetch('/api/languages').then(r=>r.json()),
      fetch('/api/keys/status').then(r=>r.json()),
      fetch('/api/runs').then(r=>r.json()),
      fetch('/api/competitors').then(r=>r.json()),
    ]).then(([ag,co,la,ks,ru,comp])=>{
      setAgents(ag);setCountries(co);setLanguages(la);setKeysStatus(ks);setRuns(ru);setCompetitors(comp);
      setEnabledAgents(ag.map(a=>a.id));
      setConfig(c=>({...c,countries:co.map(x=>x.code),competitors:comp}));
      const init={};ag.forEach(a=>init[a.id]='pending');setAgentStatuses(init);
    });
  },[]);

  const refreshRuns = useCallback(()=>{fetch('/api/runs').then(r=>r.json()).then(setRuns);},[]);
  const refreshAgents = useCallback(()=>{
    fetch('/api/agents').then(r=>r.json()).then(ag=>{
      setAgents(ag);
      setEnabledAgents(ag.map(a=>a.id));
      const init={};ag.forEach(a=>init[a.id]='pending');setAgentStatuses(prev=>{const n={...init};Object.keys(prev).forEach(k=>{if(n[k]!==undefined&&prev[k]!=='pending')n[k]=prev[k];});return n;});
    });
  },[]);

  const startPolling = useCallback((runId)=>{
    if(pollRef.current) clearInterval(pollRef.current);
    setRunning(true);
    pollRef.current = setInterval(async()=>{
      try {
        const run = await fetch(`/api/runs/${runId}`).then(r=>r.json());
        if(run.outputs){
          const ns={};run.outputs.forEach(o=>ns[o.agent_id]=o.status);
          setAgentStatuses(prev=>({...prev,...ns}));
        }
        if(run.status==='completed'||run.status==='error'){
          clearInterval(pollRef.current);pollRef.current=null;setRunning(false);refreshRuns();
        }
      } catch(e){console.error('Poll error:',e);}
    }, 2000);
  },[refreshRuns]);

  useEffect(()=>()=>{if(pollRef.current)clearInterval(pollRef.current);},[]);

  const saveKeys = async({openaiKey, anthropicKey, geminiKey, provider})=>{
    const body={provider};
    if(openaiKey) body.openai_key=openaiKey;
    if(anthropicKey) body.anthropic_key=anthropicKey;
    if(geminiKey) body.gemini_key=geminiKey;
    await fetch('/api/keys',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    setKeysStatus(await fetch('/api/keys/status').then(r=>r.json()));
  };

  const launchRun = async()=>{
    setRunning(true);
    const rs={};enabledAgents.forEach(id=>rs[id]='pending');setAgentStatuses(prev=>({...prev,...rs}));
    try {
      const resp = await fetch('/api/runs',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({...config,enabled_agents:enabledAgents})});
      const data = await resp.json();
      if(data.run_id){
        startPolling(data.run_id);
        setRuns(prev=>[{id:data.run_id,created_at:new Date().toISOString(),status:'running',trigger:'manual',has_report:false},...prev]);
      } else setRunning(false);
    } catch(e){console.error(e);setRunning(false);}
  };

  // Called by ChatPanel when GPT triggers a run
  const handleChatRun = (runId, runConfig) => {
    if(runConfig?.enabled_agents){
      const rs={};runConfig.enabled_agents.forEach(id=>rs[id]='pending');
      setAgentStatuses(prev=>({...prev,...rs}));
    }
    setRuns(prev=>[{id:runId,created_at:new Date().toISOString(),status:'running',trigger:'chat',has_report:false},...prev]);
    startPolling(runId);
  };

  const toggleAgent = id => setEnabledAgents(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const keysOk = keysStatus.openai || keysStatus.anthropic || keysStatus.gemini;
  const providerLabel = keysStatus.active_provider ? keysStatus.active_provider.toUpperCase() : 'NO AI KEY';

  const grouped = useMemo(()=>{
    const g={};agents.forEach(a=>{const c=a.category||'other';if(!g[c])g[c]=[];g[c].push(a);});return g;
  },[agents]);

  return (
    <div style={{minHeight:'100vh',background:'var(--bg-secondary)'}}>
      {/* NAV */}
      <nav style={{position:'sticky',top:0,zIndex:100,background:'white',
                   borderBottom:'1px solid var(--border)',padding:'0 32px',boxShadow:'var(--shadow-sm)'}}>
        <div style={{maxWidth:1400,margin:'0 auto',display:'flex',justifyContent:'space-between',alignItems:'center',height:60}}>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div style={{width:34,height:34,borderRadius:9,background:'var(--gradient-brand)',
                         display:'flex',alignItems:'center',justifyContent:'center',
                         color:'white',fontWeight:900,fontSize:13}}>CI</div>
            <div>
              <span style={{fontSize:16,fontWeight:900,color:'var(--navy)',letterSpacing:'-.2px'}}>unilabs</span>
              <span style={{fontSize:10,color:'var(--teal)',marginLeft:8,fontWeight:700,
                            textTransform:'uppercase',letterSpacing:'.8px'}}>Competitive Intel</span>
            </div>
          </div>
          <div style={{display:'flex',gap:3}}>
            {[{id:'dashboard',label:'Dashboard',icon:Icons.home},
              {id:'agents',label:'CI Agents',icon:Icons.target}].map(tab=>(
              <button key={tab.id} onClick={()=>setPage(tab.id)}
                style={{display:'flex',alignItems:'center',gap:6,padding:'7px 14px',borderRadius:9,
                  border:'none',cursor:'pointer',fontSize:13,fontWeight:600,transition:'.2s',
                  background:page===tab.id?'var(--navy-light)':'transparent',
                  color:page===tab.id?'var(--navy)':'var(--text-muted)'}}>
                <tab.icon size={15}/> {tab.label}
              </button>
            ))}
          </div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontSize:10,padding:'4px 10px',borderRadius:7,fontWeight:700,
              background:keysOk?'var(--green-light)':'#fef2f2',
              color:keysOk?'var(--green)':'#dc2626',
              border:`1px solid ${keysOk?'rgba(5,150,105,.15)':'rgba(220,38,38,.15)'}`}}>
              {providerLabel} {keysOk?'\u2713':'\u2717'}
            </span>
            <button onClick={()=>setShowAdmin(true)}
              style={{display:'flex',alignItems:'center',gap:5,padding:'7px 12px',borderRadius:9,
                border:'1px solid var(--border)',background:'white',cursor:'pointer',
                color:'var(--text-secondary)',fontSize:12,fontWeight:600}}>
              <Icons.settings size={14}/> Admin
            </button>
          </div>
        </div>
      </nav>

      {/* CONTENT */}
      <main style={{maxWidth:1400,margin:'0 auto',padding:'24px 32px 80px'}}>
        {page==='dashboard' && (
          <div style={{display:'grid',gridTemplateColumns:'1fr 370px',gap:24,alignItems:'start'}}>
            <div>
              {/* Stats */}
              <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:24}}>
                {[
                  {label:'CI Agents',value:agents.length,icon:Icons.target,color:'var(--navy)'},
                  {label:'Enabled',value:enabledAgents.length,icon:Icons.check,color:'var(--green)'},
                  {label:'Total Runs',value:runs.length,icon:Icons.clock,color:'var(--amber)'},
                  {label:'Competitors',value:config.competitors.length+config.custom_competitors.length,icon:Icons.users,color:'var(--purple)'},
                ].map((stat,i) => (
                  <div key={i} className="animate-in" style={{animationDelay:`${i*80}ms`,
                    background:'white',borderRadius:14,border:'1px solid var(--border)',
                    padding:'16px 18px',display:'flex',alignItems:'center',gap:12,boxShadow:'var(--shadow-sm)'}}>
                    <div style={{width:38,height:38,borderRadius:10,background:`${stat.color}10`,
                                 display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                      <stat.icon size={17} color={stat.color}/>
                    </div>
                    <div>
                      <div style={{fontSize:20,fontWeight:800,lineHeight:1,color:'var(--text-primary)'}}>{stat.value}</div>
                      <div style={{fontSize:10,color:'var(--text-muted)',fontWeight:500,marginTop:2}}>{stat.label}</div>
                    </div>
                  </div>
                ))}
              </div>

              {/* Grouped agents */}
              {Object.entries(grouped).map(([cat, catAgents])=>{
                const meta = CATEGORY_META[cat]||{label:cat,icon:Icons.layers,gradient:'var(--gradient-brand)'};
                return (
                  <div key={cat} style={{marginBottom:24}}>
                    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
                      <div style={{width:26,height:26,borderRadius:7,background:meta.gradient,
                                   display:'flex',alignItems:'center',justifyContent:'center'}}>
                        <meta.icon size={13} color="white"/>
                      </div>
                      <h2 style={{fontSize:13,fontWeight:800,color:'var(--navy)',textTransform:'uppercase',letterSpacing:'.4px'}}>{meta.label}</h2>
                      <span style={{fontSize:10,color:'var(--text-muted)',fontWeight:500}}>
                        {catAgents.filter(a=>enabledAgents.includes(a.id)).length}/{catAgents.length} enabled
                      </span>
                    </div>
                    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(310px,1fr))',gap:12}}>
                      {catAgents.map(agent=>(
                        <AgentCard key={agent.id} agent={agent}
                          status={agentStatuses[agent.id]||'pending'}
                          enabled={enabledAgents.includes(agent.id)}
                          onToggle={toggleAgent}
                          onExpand={id=>setExpandedAgent(expandedAgent===id?null:id)}
                          expanded={expandedAgent===agent.id}/>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Sidebar */}
            <div style={{position:'sticky',top:84,display:'flex',flexDirection:'column',gap:16}}>
              <RunConfigPanel agents={agents} countries={countries} languages={languages}
                competitors={competitors} enabledAgents={enabledAgents} setEnabledAgents={setEnabledAgents}
                config={config} setConfig={setConfig} onRun={launchRun} running={running} keysOk={keysOk}/>
              <SchedulerPanel/>
              <RunHistory runs={runs}
                onViewReport={id=>window.open(`/api/runs/${id}/report`,'_blank')}
                onDownloadPdf={id=>window.open(`/api/runs/${id}/pdf`,'_blank')}
                onRefresh={refreshRuns}/>
            </div>
          </div>
        )}
        {page==='agents' && <AgentsPage agents={agents} agentStatuses={agentStatuses} onAgentsChanged={refreshAgents}/>}
      </main>

      {showAdmin && <AdminPanel onClose={()=>setShowAdmin(false)} keysStatus={keysStatus} onSaveKeys={saveKeys}/>}
      <LiveMonitor agentStatuses={agentStatuses} agents={agents}/>
      <ChatPanel onRunStarted={handleChatRun} agents={agents}/>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
